# Database
spring.datasource.url=${jdbc:mysql://mysql-175d3359-suryanshchaudhary1619-d3eb.c.aivencloud.com:17283/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# HR admin account (created on first start only; empty = skip)
app.hr-admin.email=${hr@company.com}
app.hr-admin.password=${123456789}

# Frontend URL (used in the password reset link)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Attendance: check-in after this time is marked "late"
app.attendance.late-after=09:30

# Groq API
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=openai/gpt-oss-120b

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=/tmp/uploads
# Server
server.port=${PORT:8080}

# Low-memory settings for Render free plan (512 MB)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
server.tomcat.threads.max=20
spring.main.banner-mode=off