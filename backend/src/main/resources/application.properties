# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# HR admin account (created on first start only; empty = skip)
app.hr-admin.email=${HR_ADMIN_EMAIL:}
app.hr-admin.password=${HR_ADMIN_PASSWORD:}

# Frontend URL (used in the password reset link)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Attendance: check-in after this time is marked "late"
app.attendance.late-after=09:30

# Groq API
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=openai/gpt-oss-120b

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=/tmp/uploads
# Server
server.port=${PORT:8080}
